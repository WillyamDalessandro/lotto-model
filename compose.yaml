name: lotto-model
x-postgres: &postgres
  image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 2s
    timeout: 5s
    retries: 30
services:
  db:
    <<: *postgres
    environment:
      POSTGRES_USER: lotto
      POSTGRES_DB: lotto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    restart: unless-stopped
  db-test:
    <<: *postgres
    profiles: ["test"]
    environment:
      POSTGRES_USER: lotto_test
      POSTGRES_DB: lotto_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Set POSTGRES_TEST_PASSWORD in .env}
    ports: ["127.0.0.1:${POSTGRES_TEST_PORT:-5434}:5432"]
    volumes: ["postgres-test-data:/var/lib/postgresql"]
volumes:
  postgres-data:
  postgres-test-data:
